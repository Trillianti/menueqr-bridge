name: Release

on:
  release:
    types: [published]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: menueqr-bridge-stable-release
  cancel-in-progress: false

jobs:
  release-intent:
    name: Resolve release intent
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.intent.outputs.publish }}
      version: ${{ steps.intent.outputs.version }}
      tag: ${{ steps.intent.outputs.tag }}
      reason: ${{ steps.intent.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Resolve version-triggered or GitHub release
        id: intent
        run: node scripts/resolve-release-intent.mjs

      - name: Report skipped publication
        if: steps.intent.outputs.publish != 'true'
        run: echo "${{ steps.intent.outputs.reason }}"

  publish-update:
    name: Publish unsigned Windows update
    needs: release-intent
    if: needs.release-intent.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 35
    environment: bridge-update-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run release-critical checks
        run: |
          npm run typecheck
          npm test
          npm run test:integration
          npm run verify:architecture
          npm audit --omit=dev --audit-level=high

      - name: Run Electron smoke test
        env:
          RUN_ELECTRON_E2E: "1"
        run: npm run test:e2e

      - name: Build unsigned NSIS update and metadata
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          MENUEQR_BRIDGE_UPDATE_PUBLIC_URL: ${{ vars.MENUEQR_BRIDGE_UPDATE_PUBLIC_URL }}
        run: npm run package:win:update

      - name: Write installer checksum
        shell: pwsh
        run: |
          Get-FileHash release/*-Setup.exe -Algorithm SHA256 | ForEach-Object { "{0} *{1}" -f $_.Hash.ToLower(), $_.Path.Split([IO.Path]::DirectorySeparatorChar)[-1] } | Set-Content -NoNewline release/SHA256SUMS.txt

      - name: Create GitHub Release and attach update files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BRIDGE_RELEASE_TAG: ${{ needs.release-intent.outputs.tag }}
          BRIDGE_RELEASE_VERSION: ${{ needs.release-intent.outputs.version }}
        run: |
          gh release view $env:BRIDGE_RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:BRIDGE_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "MenüQR Bridge $env:BRIDGE_RELEASE_VERSION" --generate-notes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          $assets = Get-ChildItem release -File | Where-Object {
            $_.Name -eq "latest.yml" -or
            $_.Name -eq "SHA256SUMS.txt" -or
            $_.Name -like "*-Setup.exe" -or
            $_.Name -like "*-Setup.exe.blockmap"
          }
          if ($assets.Count -ne 4) { throw "Expected exactly four Windows update assets." }

          $existing = gh release view $env:BRIDGE_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json
          $duplicates = $assets | Where-Object { $existing.assets.name -contains $_.Name }
          if ($duplicates) { throw "Release already contains update assets; refusing to overwrite release files." }

          gh release upload $env:BRIDGE_RELEASE_TAG @($assets.FullName) --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish update files to Cloudflare R2 CDN
        env:
          MENUEQR_BRIDGE_UPDATE_PUBLIC_URL: ${{ vars.MENUEQR_BRIDGE_UPDATE_PUBLIC_URL }}
          MENUEQR_BRIDGE_UPDATE_R2_ENDPOINT: ${{ secrets.MENUEQR_BRIDGE_UPDATE_R2_ENDPOINT }}
          MENUEQR_BRIDGE_UPDATE_R2_BUCKET: ${{ secrets.MENUEQR_BRIDGE_UPDATE_R2_BUCKET }}
          MENUEQR_BRIDGE_UPDATE_R2_ACCESS_KEY_ID: ${{ secrets.MENUEQR_BRIDGE_UPDATE_R2_ACCESS_KEY_ID }}
          MENUEQR_BRIDGE_UPDATE_R2_SECRET_ACCESS_KEY: ${{ secrets.MENUEQR_BRIDGE_UPDATE_R2_SECRET_ACCESS_KEY }}
          MENUEQR_BRIDGE_UPDATE_R2_PREFIX: ${{ vars.MENUEQR_BRIDGE_UPDATE_R2_PREFIX }}
        run: npm run publish:updates

      - name: Verify public CDN channel
        env:
          MENUEQR_BRIDGE_UPDATE_PUBLIC_URL: ${{ vars.MENUEQR_BRIDGE_UPDATE_PUBLIC_URL }}
        run: npm run verify:published-updates

      - name: Retain release evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: menueqr-bridge-update-${{ needs.release-intent.outputs.version }}-${{ github.sha }}
          path: |
            release/*-Setup.exe
            release/*-Setup.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
