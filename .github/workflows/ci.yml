name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Test and package on Windows
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source and dependencies
        run: |
          npm run typecheck
          npm test
          npm run test:integration
          npm run verify:architecture
          npm audit --omit=dev --audit-level=high

      - name: Run Electron smoke test
        env:
          RUN_ELECTRON_E2E: "1"
        run: npm run test:e2e

      - name: Build unsigned NSIS package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run package:win

      - name: Upload CI package
        uses: actions/upload-artifact@v4
        with:
          name: menueqr-bridge-unsigned-${{ github.sha }}
          path: release/*-Setup.exe
          if-no-files-found: error
          retention-days: 14
